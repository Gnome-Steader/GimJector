<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GimJector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080a12;
      --surface:  #0f1120;
      --card:     #13162a;
      --border:   #1f2340;
      --accent:   #7c6dfa;
      --accent2:  #a78bfa;
      --red:      #ef4444;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --blue:     #3b82f6;
      --text:     #e2e8f0;
      --muted:    #4b5675;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      gap: 0;
    }

    /* ── Header ── */
    header {
      grid-area: header;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header .version { font-size: .7rem; background: var(--border); color: var(--muted);
      padding: 2px 8px; border-radius: 99px; font-weight: 600; }

    #statusPill {
      margin-left: auto;
      display: flex; align-items: center; gap: 7px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 14px; font-size: .8rem;
    }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .3s; }
    #dot.idle      { background: var(--muted); }
    #dot.flooding  { background: var(--yellow); animation: pulse 1s infinite; }
    #dot.stopped   { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.2; } }

    /* ── Sidebar ── */
    aside {
      grid-area: sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .stat-val { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .stat-lbl { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat.alive  .stat-val { color: var(--green); }
    .stat.failed .stat-val { color: var(--red); }
    .stat.total  .stat-val { color: var(--accent2); }

    /* ── Progress ── */
    #progressWrap {
      height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; display: none;
    }
    #progressBar {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
      width: 0%; transition: width .4s; border-radius: 99px;
    }

    /* ── Form ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: .7rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px;
    }
    input[type=text], input[type=number] {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 8px 12px; font-size: .88rem; outline: none;
      transition: border-color .2s; width: 100%;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #2a2f4a; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* ── Toggle ── */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px;
    }
    .toggle-label { font-size: .82rem; }
    .toggle {
      width: 36px; height: 20px; background: var(--border); border-radius: 99px;
      cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%; background: white;
      transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px; border: none; border-radius: 9px;
      font-size: .88rem; font-weight: 700; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .3; cursor: not-allowed; }
    .btn-flood { background: var(--accent); color: #fff; }
    .btn-stop  { background: var(--red);    color: #fff; }
    .btn-spam  { background: var(--blue);   color: #fff; font-size: .8rem; padding: 8px; }

    /* ── Main area ── */
    main {
      grid-area: main;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 53px);
      overflow: hidden;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 20px;
    }
    .tab {
      padding: 12px 18px;
      font-size: .82rem; font-weight: 600;
      color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }

    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }

    /* ── Bot grid ── */
    #botGrid {
      flex: 1; overflow-y: auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .bot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: .78rem;
      transition: border-color .3s;
      overflow: hidden;
    }
    .bot-card.alive      { border-color: #1a3a1a; }
    .bot-card.failed     { border-color: #3a1a1a; }
    .bot-card.connecting { border-color: #2a2a0f; }
    .bot-card.dropped    { border-color: #2a1500; }
    .bot-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .bot-card.alive      .bot-dot { background: var(--green); }
    .bot-card.failed     .bot-dot { background: var(--red); }
    .bot-card.connecting .bot-dot { background: var(--yellow); animation: pulse 1s infinite; }
    .bot-card.dropped    .bot-dot { background: #f97316; }
    .bot-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    #emptyGrid { color: var(--muted); font-size: .85rem; grid-column: 1/-1; padding: 20px 0; }

    /* ── Log ── */
    #log {
      flex: 1; overflow-y: auto;
      padding: 14px 20px;
      display: flex; flex-direction: column; gap: 4px;
      font-size: .8rem;
    }
    .log-entry { display: flex; gap: 8px; align-items: flex-start; }
    .log-time { color: var(--muted); flex-shrink: 0; font-size: .7rem; margin-top: 1px; font-variant-numeric: tabular-nums; }
    .badge {
      font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 5px;
      letter-spacing: .5px; flex-shrink: 0; margin-top: 1px; white-space: nowrap;
    }
    .badge.system { background: #1a2a1a; color: #4ade80; }
    .badge.error  { background: #2a0a0a; color: #f87171; }
    .badge.warn   { background: #2a1a00; color: #fbbf24; }
    .badge.chat   { background: #0a1a2a; color: #60a5fa; }
    .log-msg { color: var(--text); word-break: break-word; }

    #logClear {
      font-size: .72rem; padding: 4px 10px; border-radius: 6px;
      background: var(--border); color: var(--muted); border: none;
      cursor: pointer; flex: 0;
    }
    .log-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 20px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-toolbar span { font-size: .72rem; color: var(--muted); }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <h1>Gim<span>Jector</span></h1>
  <span class="version">v6.0</span>
  <div id="statusPill">
    <div id="dot" class="idle"></div>
    <span id="statusText">Ready</span>
  </div>
</header>

<!-- ── Sidebar ── -->
<aside>

  <!-- Stats -->
  <div>
    <div class="section-title">Live Stats</div>
    <div class="stats-row">
      <div class="stat alive">
        <span class="stat-val" id="statAlive">0</span>
        <span class="stat-lbl">Alive</span>
      </div>
      <div class="stat failed">
        <span class="stat-val" id="statFailed">0</span>
        <span class="stat-lbl">Failed</span>
      </div>
      <div class="stat total">
        <span class="stat-val" id="statTotal">0</span>
        <span class="stat-lbl">Total</span>
      </div>
    </div>
    <div style="margin-top:10px">
      <div id="progressWrap"><div id="progressBar"></div></div>
    </div>
  </div>

  <!-- Flood config -->
  <div>
    <div class="section-title">Flood</div>
    <div style="display:flex;flex-direction:column;gap:10px">

      <div class="field">
        <label>Game Code</label>
        <input id="inCode" type="text" placeholder="e.g. 123456" maxlength="10"/>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Random names</span>
        <div class="toggle" id="tglRandom" onclick="toggleRandom()"></div>
      </div>

      <div class="field" id="prefixField">
        <label>Name Prefix</label>
        <input id="inPrefix" type="text" placeholder="Bot" value="Bot" maxlength="16"/>
      </div>

      <div class="row2">
        <div class="field">
          <label>Bot Count</label>
          <input id="inCount" type="number" value="10" min="1" max="200"/>
        </div>
        <div class="field">
          <label>Delay (ms)</label>
          <input id="inDelay" type="number" value="300" min="0" max="5000"/>
        </div>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Auto-reconnect</span>
        <div class="toggle" id="tglReconnect" onclick="toggleReconnect()"></div>
      </div>

      <div class="btn-row">
        <button class="btn-flood" id="btnFlood" onclick="startFlood()">🚀 Flood</button>
        <button class="btn-stop"  id="btnStop"  onclick="stopFlood()" disabled>⛔ Stop</button>
      </div>

    </div>
  </div>

  <!-- Chat spam -->
  <div>
    <div class="section-title">Chat Spam</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field">
        <label>Message</label>
        <input id="inSpamMsg" type="text" placeholder="hi everyone" maxlength="100"/>
      </div>
      <div class="field">
        <label>Interval (ms)</label>
        <input id="inSpamInterval" type="number" value="3000" min="500" max="60000"/>
      </div>
      <button class="btn-spam" onclick="toggleSpam()" id="btnSpam">▶ Start Spam</button>
    </div>
  </div>

</aside>

<!-- ── Main ── -->
<main>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('bots',this)">Bot Grid</div>
    <div class="tab"        onclick="switchTab('log', this)">Log</div>
  </div>

  <!-- Bot Grid tab -->
  <div class="tab-content active" id="tab-bots">
    <div id="botGrid">
      <span id="emptyGrid">No bots spawned yet.</span>
    </div>
  </div>

  <!-- Log tab -->
  <div class="tab-content" id="tab-log">
    <div class="log-toolbar">
      <span id="logCount">0 entries</span>
      <button id="logClear" onclick="clearLog()">Clear</button>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
  /* ── State ── */
  let ws        = null;
  let spamming  = false;
  let randomOn  = false;
  let reconnOn  = false;
  let logCount  = 0;

  /* ── Bridge WS ── */
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen    = () => log('system', 'Bridge connected');
    ws.onclose   = () => setStatus('stopped', 'Bridge disconnected — reload');
    ws.onerror   = () => log('error',  'Bridge WebSocket error');
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'status':    onStatus(msg);             break;
        case 'stats':     onStats(msg);              break;
        case 'log':       log(msg.level, msg.msg);   break;
        case 'error':     log('error', msg.message); break;
        case 'botUpdate': onBotUpdate(msg);          break;
        case 'clearBots': clearBots();               break;
      }
    };
  }

  /* ── Status ── */
  function onStatus(msg) {
    setStatus(msg.state, msg.message);
    const flooding = msg.state === 'flooding';
    document.getElementById('btnFlood').disabled = flooding;
    document.getElementById('btnStop').disabled  = !flooding;
  }

  function setStatus(state, text) {
    document.getElementById('dot').className        = state;
    document.getElementById('statusText').textContent = text;
  }

  /* ── Stats ── */
  function onStats({ total, alive, failed }) {
    document.getElementById('statTotal').textContent  = total;
    document.getElementById('statAlive').textContent  = alive;
    document.getElementById('statFailed').textContent = failed;

    const wrap = document.getElementById('progressWrap');
    const bar  = document.getElementById('progressBar');
    if (total > 0) {
      wrap.style.display = 'block';
      bar.style.width    = `${Math.round((alive / total) * 100)}%`;
    } else {
      wrap.style.display = 'none';
    }
  }

  /* ── Bot grid ── */
  function onBotUpdate({ id, name, state }) {
    const gridId = `bot-${id}`;
    let   card   = document.getElementById(gridId);

    // Remove empty placeholder
    const empty = document.getElementById('emptyGrid');
    if (empty) empty.remove();

    if (!card) {
      card = document.createElement('div');
      card.id = gridId;
      card.className = 'bot-card';
      card.innerHTML = `<div class="bot-dot"></div><span class="bot-name" title="${esc(name)}">${esc(name)}</span>`;
      document.getElementById('botGrid').appendChild(card);
    }

    card.className = `bot-card ${state}`;
  }

  function clearBots() {
    const grid = document.getElementById('botGrid');
    grid.innerHTML = '<span id="emptyGrid">No bots spawned yet.</span>';
  }

  /* ── Log ── */
  function log(level, msg) {
    const el    = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const now = new Date().toLocaleTimeString('en-US', { hour12: false });
    entry.innerHTML = `<span class="log-time">${now}</span>`
                    + `<span class="badge ${level||'system'}">${(level||'SYS').toUpperCase()}</span>`
                    + `<span class="log-msg">${esc(msg)}</span>`;
    el.appendChild(entry);
    el.scrollTop = el.scrollHeight;
    logCount++;
    document.getElementById('logCount').textContent = `${logCount} entries`;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
    logCount = 0;
    document.getElementById('logCount').textContent = '0 entries';
  }

  /* ── Tabs ── */
  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  /* ── Toggles ── */
  function toggleRandom() {
    randomOn = !randomOn;
    document.getElementById('tglRandom').classList.toggle('on', randomOn);
    document.getElementById('prefixField').style.display = randomOn ? 'none' : '';
  }

  function toggleReconnect() {
    reconnOn = !reconnOn;
    document.getElementById('tglReconnect').classList.toggle('on', reconnOn);
  }

  /* ── Flood ── */
  function startFlood() {
    const code   = document.getElementById('inCode').value.trim();
    const prefix = document.getElementById('inPrefix').value.trim() || 'Bot';
    const count  = parseInt(document.getElementById('inCount').value)   || 10;
    const delay  = parseInt(document.getElementById('inDelay').value)   ?? 300;

    if (!code) { alert('Enter a game code.'); return; }
    clearBots();
    onStats({ total: count, alive: 0, failed: 0 });

    ws.send(JSON.stringify({
      type: 'flood', code, namePrefix: prefix,
      randomNames: randomOn, count, delay, autoReconnect: reconnOn,
      spamMessage:  spamming ? document.getElementById('inSpamMsg').value.trim()    : null,
      spamInterval: spamming ? parseInt(document.getElementById('inSpamInterval').value) : null,
    }));
  }

  function stopFlood() {
    ws.send(JSON.stringify({ type: 'stop' }));
    document.getElementById('btnFlood').disabled = false;
    document.getElementById('btnStop').disabled  = true;
    spamming = false;
    document.getElementById('btnSpam').textContent = '▶ Start Spam';
  }

  /* ── Chat spam ── */
  function toggleSpam() {
    spamming = !spamming;
    const msg      = document.getElementById('inSpamMsg').value.trim();
    const interval = parseInt(document.getElementById('inSpamInterval').value);
    document.getElementById('btnSpam').textContent = spamming ? '⏹ Stop Spam' : '▶ Start Spam';
    ws.send(JSON.stringify({
      type: 'spam',
      message:    spamming ? msg      : null,
      intervalMs: spamming ? interval : null,
    }));
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  connect();
</script>
</body>
</html>
